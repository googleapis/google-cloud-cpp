name: Publish to BCR via OSS Exit Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to stage and publish to BCR via OSS Exit Gate (e.g. v2.34.0)'
        required: true
        type: string

permissions: {}

jobs:
  publish-bcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Stage BCR release archive to OSS Exit Gate Artifact Registry
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          ARCHIVE="google-cloud-cpp-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="google-cloud-cpp-${VERSION}/" HEAD > "${ARCHIVE}"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=google-cloud-cpp--bcr \
            --package=google_cloud_cpp \
            --version="${VERSION}" \
            --source="${ARCHIVE}"

      - name: Trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "google_cloud_cpp",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/google-cloud-cpp/bcr/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
