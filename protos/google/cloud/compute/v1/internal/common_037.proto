  // Output only. Errors encountered during bulk instance operation.
  optional Error error = 1 [json_name = "error"];

  // Output only. Timestamp of the last progress check of bulk instance
  // operation. Timestamp is in RFC3339 text format.
  optional string timestamp = 2 [json_name = "timestamp"];
}

// The list of instance statuses and the number of instances in this managed
// instance group that have the status. For more information about how to
// interpret each status check the instance lifecycle documentation.
// Currently only shown for TPU MIGs.
message InstanceGroupManagerStatusInstanceStatusSummary {
  // Output only. The number of instances in the managed instance group
  // that have DEPROVISIONING status.
  optional int32 deprovisioning = 1 [json_name = "deprovisioning"];

  // Output only. The number of instances that have not been created yet or
  // have been deleted. Includes only instances that would be shown in the
  // listManagedInstances method and not all instances that have been
  // deleted in the lifetime of the MIG.
  // Does not include FlexStart instances that are waiting for the resources
  // availability, they are considered as 'pending'.
  optional int32 non_existent = 2 [json_name = "nonExistent"];

  // Output only. The number of instances in the managed instance group
  // that have PENDING status, that is FlexStart instances that are waiting
  // for resources. Instances that do not exist because of the other reasons
  // are counted as 'non_existent'.
  optional int32 pending = 3 [json_name = "pending"];

  // Output only. The number of instances in the managed instance group
  // that have PENDING_STOP status.
  optional int32 pending_stop = 4 [json_name = "pendingStop"];

  // Output only. The number of instances in the managed instance group
  // that have PROVISIONING status.
  optional int32 provisioning = 5 [json_name = "provisioning"];

  // Output only. The number of instances in the managed instance group
  // that have REPAIRING status.
  optional int32 repairing = 6 [json_name = "repairing"];

  // Output only. The number of instances in the managed instance group
  // that have RUNNING status.
  optional int32 running = 7 [json_name = "running"];

  // Output only. The number of instances in the managed instance group
  // that have STAGING status.
  optional int32 staging = 8 [json_name = "staging"];

  // Output only. The number of instances in the managed instance group
  // that have STOPPED status.
  optional int32 stopped = 9 [json_name = "stopped"];

  // Output only. The number of instances in the managed instance group
  // that have STOPPING status.
  optional int32 stopping = 10 [json_name = "stopping"];

  // Output only. The number of instances in the managed instance group
  // that have SUSPENDED status.
  optional int32 suspended = 11 [json_name = "suspended"];

  // Output only. The number of instances in the managed instance group
  // that have SUSPENDING status.
  optional int32 suspending = 12 [json_name = "suspending"];

  // Output only. The number of instances in the managed instance group
  // that have TERMINATED status.
  optional int32 terminated = 13 [json_name = "terminated"];
}

message InstanceGroupManagerStatusStateful {
  // Output only. A bit indicating whether the managed instance group
  // has stateful configuration, that is, if you have configured any items
  // in a stateful policy or in per-instance configs.
  // The group might report that it has no stateful configuration even when
  // there is still some preserved state on a managed instance, for example,
  // if you have deleted all PICs but not yet applied those deletions.
  optional bool has_stateful_config = 1 [json_name = "hasStatefulConfig"];

  // Output only. Status of per-instance configurations on the instances.
  optional InstanceGroupManagerStatusStatefulPerInstanceConfigs
      per_instance_configs = 2 [json_name = "perInstanceConfigs"];
}

message InstanceGroupManagerStatusStatefulPerInstanceConfigs {
  // Output only. A bit indicating if all of the group's per-instance
  // configurations
  // (listed in the output of a listPerInstanceConfigs API call) have
  // status EFFECTIVE or there are no per-instance-configs.
  optional bool all_effective = 1 [json_name = "allEffective"];
}

message InstanceGroupManagerStatusVersionTarget {
  // Output only. A bit indicating whether version target has been reached
  // in this managed instance group, i.e. all instances are in their target
  // version. Instances' target version are specified byversion field on
  // Instance Group Manager.
  optional bool is_reached = 1 [json_name = "isReached"];
}

message InstanceGroupManagerTargetSizePolicy {
  // The mode of target size policy based on which the MIG creates its VMs
  // individually or all at once.
  // BULK: The mode in which the MIG creates VMs all at once. In this mode, if
  // the
  // MIG is unable to create even one VM, the MIG waits until all VMs can be
  // created at the same time.
  // INDIVIDUAL: The mode in which the MIG creates VMs individually. In this
  // mode, if
  // the MIG is unable to create a VM, the MIG will continue to create the
  // other VMs in the group. This is the default mode.
  // UNSPECIFIED_MODE: If mode is unspecified, MIG will behave as in the default
  // `INDIVIDUAL`
  // mode.
  optional string mode = 1 [json_name = "mode"];
}

message InstanceGroupManagerUpdatePolicy {
  // The
  // instance redistribution policy for regional managed instance groups.
  // Valid values are:
  //
  //    - PROACTIVE (default): The group attempts to maintain an
  //    even distribution of VM instances across zones in the region.
  //    - NONE: For non-autoscaled groups, proactive
  //    redistribution is disabled.
  // NONE: No action is being proactively performed in order to bring this IGM
  // to its target instance distribution.
  // PROACTIVE: This IGM will actively converge to its target instance
  // distribution.
  optional string instance_redistribution_type = 1
      [json_name = "instanceRedistributionType"];

  // The maximum number of instances that can be created above the
  // specifiedtargetSize during the update process. This value can be
  // either a fixed number or, if the group has 10 or more instances, a
  // percentage. If you set a percentage, the number of instances is rounded
  // if necessary.  The default value for maxSurge is a fixed
  // value equal to the number of zones in which the managed instance group
  // operates.
  //
  // At least one of either maxSurge ormaxUnavailable must be greater than 0.
  // Learn more about maxSurge.
  optional FixedOrPercent max_surge = 2 [json_name = "maxSurge"];

  // The maximum number of instances that can be unavailable during the update
  // process. An instance is considered available if all of the following
  // conditions are satisfied:
  //
  //
  //
  //      - The instance's status is
  //      RUNNING.
  //    - If there is a health
  //      check on the instance group, the instance's health check status
  //      must be HEALTHY at least once. If there is no health check
  //      on the group, then the instance only needs to have a status of
  //      RUNNING to be considered available.
  //
  //
  // This value can be either a fixed number or, if the group has 10 or more
  // instances, a percentage. If you set a percentage, the number of instances
  // is rounded if necessary. The default value formaxUnavailable is a fixed
  // value equal to the number of zones
  // in which the managed instance group operates.
  //
  // At least one of either maxSurge ormaxUnavailable must be greater than 0.
  // Learn more about maxUnavailable.
  optional FixedOrPercent max_unavailable = 3 [json_name = "maxUnavailable"];

  // Minimal action to be taken on an instance. Use this option to minimize
  // disruption as much as possible or to apply a more disruptive action than
  // is necessary.
  //
  //    - To limit disruption as much as possible, set the minimal action
  // toREFRESH. If your update requires a more disruptive action,
  //    Compute Engine performs the necessary action to execute the update.
  //    - To apply a more disruptive action than is strictly necessary, set the
  //    minimal action to RESTART or REPLACE. For
  //    example, Compute Engine does not need to restart a VM to change its
  //    metadata. But if your application reads instance metadata only when a VM
  //    is restarted, you can set the minimal action to RESTART in
  //    order to pick up metadata changes.
  // NONE: Do not perform any action.
  // REFRESH: Do not stop the instance.
  // REPLACE: (Default.) Replace the instance according to the replacement
  // method
  // option.
  // RESTART: Stop the instance and start it again.
  optional string minimal_action = 4 [json_name = "minimalAction"];

  // Most disruptive action that is allowed to be taken on an instance.
  // You can specify either NONE to forbid any actions,REFRESH to avoid
  // restarting the VM and to limit disruption
  // as much as possible. RESTART to allow actions that can be
  // applied without instance replacing or REPLACE to allow all
  // possible actions. If the Updater determines that the minimal update
  // action needed is more disruptive than most disruptive allowed action you
  // specify it will not perform the update at all.
  // NONE: Do not perform any action.
  // REFRESH: Do not stop the instance.
  // REPLACE: (Default.) Replace the instance according to the replacement
  // method
  // option.
  // RESTART: Stop the instance and start it again.
  optional string most_disruptive_allowed_action = 5
      [json_name = "mostDisruptiveAllowedAction"];

  // What action should be used to replace instances.
  // See minimal_action.REPLACE
  // RECREATE: Instances will be recreated (with the same name)
  // SUBSTITUTE: Default option: instances will be deleted and created (with a
  // new name)
  optional string replacement_method = 6 [json_name = "replacementMethod"];

  // The type
  // of update process. You can specify either PROACTIVE so
  // that the MIG automatically updates VMs to the latest configurations
  // orOPPORTUNISTIC so that you can select the VMs that you want
  // to update.
  // OPPORTUNISTIC: MIG will apply new configurations
  // to existing VMs only when you selectively target specific or all VMs to
  // be updated.
  // PROACTIVE: MIG will automatically apply new configurations
  // to all or a subset of existing VMs and also to new VMs that are added
  // to the group.
  optional string type = 7 [json_name = "type"];
}

message InstanceGroupManagerVersion {
  // The URL of the instance template that is specified for this managed
  // instance group. The group uses this template to create new instances in
  // the managed instance group until the `targetSize` for this version is
  // reached. The templates for existing instances in the group do not change
  // unless you run recreateInstances, runapplyUpdatesToInstances, or set the
  // group'supdatePolicy.type to PROACTIVE; in those cases,
  // existing instances are updated until the `targetSize` for this version is
  // reached.
  optional string instance_template = 1 [json_name = "instanceTemplate"];

  // Name of the version. Unique among all versions in the scope of this
  // managed instance group.
  optional string name = 2 [json_name = "name"];

  // Specifies the intended number of instances to be created from
  // theinstanceTemplate. The final number of instances created
  // from the template will be equal to:
  //
  //
  //      - If expressed as a fixed number, the minimum of either
  //       targetSize.fixed or
  //       instanceGroupManager.targetSize is used.
  //      - if expressed as a percent, the targetSize
  //      would be (targetSize.percent/100 *
  //      InstanceGroupManager.targetSize) If there is a remainder, the
  //      number is rounded.
  //
  //  If unset, this version will update any remaining instances not
  // updated by another version. ReadStarting
  // a canary update for more information.
  optional FixedOrPercent target_size = 3 [json_name = "targetSize"];
}

message InstanceManagedByIgmError {
  // Output only. Contents of the error.
  optional InstanceManagedByIgmErrorManagedInstanceError error = 1
      [json_name = "error"];

  // Output only. Details of the instance action that triggered this error.
  // May be null, if the error was not caused by an action on an instance.
  // This field is optional.
  optional InstanceManagedByIgmErrorInstanceActionDetails
      instance_action_details = 2 [json_name = "instanceActionDetails"];

  // Output only. The time that this error occurred. This value is in RFC3339
  // text format.
  optional string timestamp = 3 [json_name = "timestamp"];
}

message InstanceManagedByIgmErrorInstanceActionDetails {
  // Output only. Action that managed instance group was executing on the
  // instance when the
  // error occurred. Possible values:
  // ABANDONING: The managed instance group is abandoning this instance. The
  // instance
  // will be removed from the instance group and from any target pools that
  // are associated with this group.
  // CREATING: The managed instance group is creating this instance. If the
  // group
  // fails to create this instance, it will try again until it is
  // successful.
  // CREATING_WITHOUT_RETRIES: The managed instance group is attempting to
  // create this instance
  // only once. If the group fails to create this instance, it does
  // not try again and the group's targetSize value is
  // decreased.
  // DELETING: The managed instance group is permanently deleting this instance.
  // NONE: The managed instance group has not scheduled any actions for this
  // instance.
  // RECREATING: The managed instance group is recreating this instance.
  // REFRESHING: The managed instance group is applying configuration changes to
  // the
  // instance without stopping it. For example, the group can update the
  // target pool list for an instance without stopping that instance.
  // RESTARTING: The managed instance group is restarting this instance.
  // RESUMING: The managed instance group is resuming this instance.
  // STARTING: The managed instance group is starting this instance.
  // STOPPING: The managed instance group is stopping this instance.
  // SUSPENDING: The managed instance group is suspending this instance.
  // VERIFYING: The managed instance group is verifying this already created
  // instance.
  // Verification happens every time the instance is (re)created or restarted
  // and consists of:
  //  1. Waiting until health check specified as part of this managed instance
  //     group's autohealing policy reports HEALTHY.
  //     Note: Applies only if autohealing policy has a health check specified
  //  2. Waiting for addition verification steps performed as post-instance
  //     creation (subject to future extensions).
  optional string action = 1 [json_name = "action"];

  // Output only. The URL of the instance. The URL can be set even if the
  // instance has not
  // yet been created.
  optional string instance = 2 [json_name = "instance"];

  // Output only. Version this instance was created from, or was being
  // created from, but the creation failed. Corresponds to one of the versions
  // that were set on the Instance Group Manager resource at the time this
  // instance was being created.
  optional ManagedInstanceVersion version = 3 [json_name = "version"];
}

message InstanceManagedByIgmErrorManagedInstanceError {
  // Output only. Error code.
  optional string code = 1 [json_name = "code"];

  // Output only. Error message.
  optional string message = 2 [json_name = "message"];
}

// Represents the change that you want to make to the instance properties.
message InstancePropertiesPatch {
  // The label key-value pairs that you want to patch onto the instance.
  map<string, string> labels = 1 [json_name = "labels"];

  // The metadata key-value pairs that you want to patch onto the instance. For
  // more information, see Project and
  // instance metadata.
  map<string, string> metadata = 2 [json_name = "metadata"];
}

// A Managed Instance resource.
message ManagedInstance {
  // Output only. [Output Only] The current action that the managed instance
  // group has
  // scheduled for the instance. Possible values:
  //
  //    - NONE The instance is running, and the managed
  //    instance group does not have any scheduled actions for this instance.
  //    - CREATING The managed instance group is creating this
  //    instance. If the group fails to create this instance, it will try again
  //    until it is successful.
  //    - CREATING_WITHOUT_RETRIES The managed instance group
  //    is attempting to create this instance only once. If the group fails
  //    to create this instance, it does not try again and the group'stargetSize
  // value is decreased instead.
  //    - RECREATING The managed instance group is recreating
  //    this instance.
  //    - DELETING The managed instance group is permanently
  //    deleting this instance.
  //    - ABANDONING The managed instance group is abandoning
  //    this instance. The instance will be removed from the instance group
  //    and from any target pools that are associated with this group.
  //    - RESTARTING The managed instance group is restarting
  //    the instance.
  //    - REFRESHING The managed instance group is applying
  //    configuration changes to the instance without stopping it. For example,
  //    the group can update the target pool list for an instance without
  //    stopping that instance.
  //    - VERIFYING The managed instance group has created the
  //    instance and it is in the process of being verified.
  // ABANDONING: The managed instance group is abandoning this instance. The
  // instance
  // will be removed from the instance group and from any target pools that
  // are associated with this group.
  // CREATING: The managed instance group is creating this instance. If the
  // group
  // fails to create this instance, it will try again until it is
  // successful.
  // CREATING_WITHOUT_RETRIES: The managed instance group is attempting to
  // create this instance
  // only once. If the group fails to create this instance, it does
  // not try again and the group's targetSize value is
  // decreased.
  // DELETING: The managed instance group is permanently deleting this instance.
  // NONE: The managed instance group has not scheduled any actions for this
  // instance.
  // RECREATING: The managed instance group is recreating this instance.
  // REFRESHING: The managed instance group is applying configuration changes to
  // the
  // instance without stopping it. For example, the group can update the
  // target pool list for an instance without stopping that instance.
  // RESTARTING: The managed instance group is restarting this instance.
  // RESUMING: The managed instance group is resuming this instance.
  // STARTING: The managed instance group is starting this instance.
  // STOPPING: The managed instance group is stopping this instance.
  // SUSPENDING: The managed instance group is suspending this instance.
  // VERIFYING: The managed instance group is verifying this already created
  // instance.
  // Verification happens every time the instance is (re)created or restarted
  // and consists of:
  //  1. Waiting until health check specified as part of this managed instance
  //     group's autohealing policy reports HEALTHY.
  //     Note: Applies only if autohealing policy has a health check specified
  //  2. Waiting for addition verification steps performed as post-instance
  //     creation (subject to future extensions).
  optional string current_action = 1 [json_name = "currentAction"];

  // Output only. [Output only] The unique identifier for this resource. This
  // field is empty
  // when instance does not exist.
  optional string id = 2 [json_name = "id"];

  // Output only. [Output Only] The URL of the instance. The URL can exist even
  // if the
  // instance has not yet been created.
  optional string instance = 3 [json_name = "instance"];

  // Output only. [Output Only] Health state of the instance per health-check.
  repeated ManagedInstanceInstanceHealth instance_health = 4
      [json_name = "instanceHealth"];

  // Output only. [Output Only] The status of the instance. This field is empty
  // when
  // the instance does not exist.
  // DEPROVISIONING: The instance is halted and we are performing tear down
  // tasks like network
  // deprogramming, releasing quota, IP, tearing down disks etc.
  // PENDING: For Flex Start provisioning instance is waiting for available
  // capacity
  // from Dynamic Workload Scheduler (DWS).
  // PENDING_STOP: The instance is gracefully shutting down.
  // PROVISIONING: Resources are being allocated for the instance.
  // REPAIRING: The instance is in repair.
  // RUNNING: The instance is running.
  // STAGING: All required resources have been allocated and the instance
  // is being started.
  // STOPPED: The instance has stopped successfully.
  // STOPPING: The instance is currently stopping (either being deleted or
  // killed).
  // SUSPENDED: The instance has suspended.
  // SUSPENDING: The instance is suspending.
  // TERMINATED: The instance has stopped (either by explicit action or
  // underlying
  // failure).
  optional string instance_status = 5 [json_name = "instanceStatus"];

  // Output only. [Output Only] Information about the last attempt to create or
  // delete
  // the instance.
  optional ManagedInstanceLastAttempt last_attempt = 6
      [json_name = "lastAttempt"];

  // Output only. [Output Only] The name of the instance. The name always exists
  // even if the
  // instance has not yet been created.
  optional string name = 10 [json_name = "name"];

  // Output only. [Output Only] Preserved state applied from per-instance config
  // for this instance.
  optional PreservedState preserved_state_from_config = 7
      [json_name = "preservedStateFromConfig"];

  // Output only. [Output Only] Preserved state generated based on stateful
  // policy
  // for this instance.
  optional PreservedState preserved_state_from_policy = 8
      [json_name = "preservedStateFromPolicy"];

  // Output only. [Output Only] Instance properties selected for this instance
  // resulting from
  // InstanceFlexibilityPolicy.
  optional ManagedInstancePropertiesFromFlexibilityPolicy
      properties_from_flexibility_policy = 11
      [json_name = "propertiesFromFlexibilityPolicy"];

  // Output only. Information about the termination timestamp of the instance,
  // if applicable.
  optional ManagedInstanceScheduling scheduling = 12 [json_name = "scheduling"];

  // Output only. Specifies the graceful shutdown details if the instance is in
  // `PENDING_STOP` state or there is a programmed stop scheduled.
  optional ManagedInstanceShutdownDetails shutdown_details = 13
      [json_name = "shutdownDetails"];

  // Output only. [Output Only] Intended version of this instance.
  optional ManagedInstanceVersion version = 9 [json_name = "version"];
}

message ManagedInstanceInstanceHealth {
  // Output only. [Output Only] The current detailed instance health state.
  // DRAINING: The instance is being drained. The existing connections to the
  // instance
  // have time to complete, but the new ones are being refused.
  // HEALTHY: The instance is reachable i.e. a connection to the application
  // health
  // checking endpoint can be established, and conforms to the requirements
  // defined by the health check.
  // TIMEOUT: The instance is unreachable i.e. a connection to the application
  // health
  // checking endpoint cannot be established, or the server does not respond
  // within the specified timeout.
  // UNHEALTHY: The instance is reachable, but does not conform to the
  // requirements
  // defined by the health check.
  // UNKNOWN: The health checking system is aware of the instance but its health
  // is
  // not known at the moment.
  optional string detailed_health_state = 1 [json_name = "detailedHealthState"];

  // Output only. [Output Only] The URL for the health check that verifies
  // whether the
  // instance is healthy.
  optional string health_check = 2 [json_name = "healthCheck"];
}

message ManagedInstanceLastAttempt {
  message Errors {
    message ErrorsItem {
      // [Output Only] The error type identifier for this error.
      optional string code = 1 [json_name = "code"];

      message ErrorDetailsItem {
        // Error information containing structured domain, reason, and metadata.
        optional ErrorInfo error_info = 1 [json_name = "errorInfo"];

        // Links and information to help the user resolve the error.
        optional Help help = 2 [json_name = "help"];

        // A localized human-readable error message intended for end users.
        optional LocalizedMessage localized_message = 3
            [json_name = "localizedMessage"];

        // Details about quota limits and metrics when a quota is exceeded.
        optional QuotaExceededInfo quota_info = 4 [json_name = "quotaInfo"];
      }

      // [Output Only] An optional list of messages that contain the error
      // details. There is a set of defined message types to use for providing
      // details.The syntax depends on the error code. For example,
      // QuotaExceededInfo will have details when the error code is
      // QUOTA_EXCEEDED.
      repeated ErrorDetailsItem error_details = 2 [json_name = "errorDetails"];

      // [Output Only] Indicates the field in the request that caused the error.
      // This property is optional.
      optional string location = 3 [json_name = "location"];

      // [Output Only] An optional, human-readable error message.
      optional string message = 4 [json_name = "message"];
    }

    // [Output Only] The array of errors encountered while processing this
    // operation.
    repeated ErrorsItem errors = 1 [json_name = "errors"];
  }

  // Output only. [Output Only] Encountered errors during the last attempt to
  // create or
  // delete the instance.
  optional Errors errors = 1 [json_name = "errors"];
}

message ManagedInstancePropertiesFromFlexibilityPolicy {
  // Output only. The machine type to be used for this instance.
  optional string machine_type = 1 [json_name = "machineType"];
}

message ManagedInstanceScheduling {
  // Output only. The timestamp at which the underlying instance will be
  // triggered for graceful shutdown if it is configured. This is in RFC3339
  // text format.
  optional string graceful_shutdown_timestamp = 1
      [json_name = "gracefulShutdownTimestamp"];

  // Output only. The timestamp at which the managed instance will be
  // terminated. This is
  // in RFC3339 text
  // format.
  optional string termination_timestamp = 2
      [json_name = "terminationTimestamp"];
}

message ManagedInstanceShutdownDetails {
  // Output only. The duration for graceful shutdown. Only applicable when the
  // instance is
  // in `PENDING_STOP` state.
  optional Duration max_duration = 1 [json_name = "maxDuration"];

  // Output only. Past timestamp indicating the beginning of `PENDING_STOP`
  // state of
  // instance in RFC3339
  // text format.
  optional string request_timestamp = 2 [json_name = "requestTimestamp"];
}

message ManagedInstanceVersion {
  // Output only. [Output Only] The intended template of the instance. This
  // field is empty
  // when current_action is one of { DELETING, ABANDONING }.
  optional string instance_template = 1 [json_name = "instanceTemplate"];

  // Output only. [Output Only] Name of the version.
  optional string name = 2 [json_name = "name"];
}

message StatefulPolicy {
  optional StatefulPolicyPreservedState preserved_state = 1
      [json_name = "preservedState"];
}

// Configuration of preserved resources.
message StatefulPolicyPreservedState {
  // Disks created on the instances that will be preserved on instance
  // delete, update, etc. This map is keyed with the device names of
  // the disks.
  map<string, StatefulPolicyPreservedStateDiskDevice> disks = 1
      [json_name = "disks"];

  // External network IPs assigned to the instances that will be preserved on
  // instance delete, update, etc. This map is keyed with the network
  // interface name.
  map<string, StatefulPolicyPreservedStateNetworkIp> external_i_ps = 2
      [json_name = "externalIPs"];

  // Internal network IPs assigned to the instances that will be preserved on
  // instance delete, update, etc. This map is keyed with the network
  // interface name.
  map<string, StatefulPolicyPreservedStateNetworkIp> internal_i_ps = 3
      [json_name = "internalIPs"];
}

message StatefulPolicyPreservedStateDiskDevice {
  // These stateful disks will never be deleted during autohealing,
  // update or VM instance recreate operations.
  // This flag is used to configure if the disk should be deleted after it
  // is no longer used by the group, e.g. when the given instance or
  // the whole group is deleted. Note: disks attached inREAD_ONLY mode cannot be
  // auto-deleted.
  // NEVER:
  // ON_PERMANENT_INSTANCE_DELETION:
  optional string auto_delete = 1 [json_name = "autoDelete"];
}

message StatefulPolicyPreservedStateNetworkIp {
  // These stateful IPs will never be released during autohealing,
  // update or VM instance recreate operations.
  // This flag is used to configure if the IP reservation should be deleted
  // after it is no longer used by the group, e.g. when the given instance
  // or the whole group is deleted.
  // NEVER:
  // ON_PERMANENT_INSTANCE_DELETION:
  optional string auto_delete = 1 [json_name = "autoDelete"];
}
